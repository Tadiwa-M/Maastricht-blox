<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maastricht Blox</title>
<style>
  :root { --panel: rgba(18, 22, 30, 0.72); --text: #f3f1ea; --muted: #b9bcc4; --accent: #ffcf5a; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfd9e2; color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  .panel { position: fixed; background: var(--panel); backdrop-filter: blur(8px); border-radius: 10px;
    padding: 10px 14px; box-shadow: 0 4px 18px rgba(0,0,0,.25); }
  #hud { top: 14px; left: 14px; display: grid; gap: 8px; min-width: 240px; }
  #hud h1 { margin: 0; font-size: 15px; letter-spacing: .02em; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  #hudToggle { font: inherit; font-size: 11px; font-weight: 400; color: var(--muted); background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.25); border-radius: 5px; padding: 1px 8px; cursor: pointer; }
  #hud.collapsed { min-width: 0; padding: 6px 10px; }
  #hud.collapsed > :not(h1) { display: none !important; }
  #hud label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  #hud input[type=range] { flex: 1; accent-color: var(--accent); }
  #timeLabel { color: var(--text); font-variant-numeric: tabular-nums; min-width: 3em; text-align: right; }
  #views a { color: var(--accent); margin-right: 10px; text-decoration: none; }
  #stats { color: var(--muted); font-variant-numeric: tabular-nums; max-width: 300px; }
  #hud select { background: rgba(255,255,255,.1); color: var(--text); border: 1px solid rgba(255,255,255,.25); border-radius: 5px; padding: 1px 4px; }
  #hud select option { color: #111; }
  #tierLabel { color: var(--muted); }
  #info { top: 14px; right: 14px; max-width: 320px; display: grid; gap: 2px; }
  #info b { font-size: 14px; } #info span { color: var(--accent); } #info small { color: var(--muted); }
  #foot { bottom: 10px; right: 14px; padding: 5px 10px; color: var(--muted); font-size: 11px; }
  body.shot .panel:not(#foot) { display: none; }
  #loading { position: fixed; inset: 0; z-index: 10; display: grid; place-content: center; gap: 18px;
    text-align: center; padding: 16px; background: radial-gradient(circle at 50% 40%, #2a3546, #12161e 70%);
    transition: opacity .7s ease; }
  #loading.gone { opacity: 0; pointer-events: none; }
  #loading .logo { display: flex; gap: 6px; justify-content: center; }
  #loading .logo i { width: 22px; height: 14px; border-radius: 3px; background: var(--accent);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); animation: brick 1.2s ease-in-out infinite; }
  #loading .logo i:nth-child(2) { background: #d9534f; animation-delay: .15s; }
  #loading .logo i:nth-child(3) { background: #4a90d9; animation-delay: .3s; }
  #loading .logo i:nth-child(4) { background: #5cb85c; animation-delay: .45s; }
  @keyframes brick { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-8px); } }
  #loading h2 { margin: 0; font-size: clamp(22px, 5vw, 34px); letter-spacing: .02em; }
  #loading .bar { width: min(320px, 80vw); height: 8px; margin: 0 auto; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: width .3s ease; }
  #loading .msg { color: var(--muted); min-height: 1.4em; }
  #loading .tip { color: var(--muted); font-size: 12px; opacity: .8; }
  #loading.failed .bar { display: none; }
  #loading.failed .msg { color: #ff8a80; }
  .notice { top: 14px; left: 50%; transform: translateX(-50%); z-index: 11; max-width: min(520px, calc(100vw - 32px));
    box-sizing: border-box; color: var(--text); }
  .notice button { margin-left: 8px; font: inherit; color: #111; background: var(--accent); border: 0; border-radius: 5px; padding: 2px 10px; cursor: pointer; }
  @media (max-width: 600px) { #hud { right: 14px; min-width: 0; } #info { top: auto; bottom: 44px; left: 14px; } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="loading" role="status" aria-live="polite">
  <div class="logo"><i></i><i></i><i></i><i></i></div>
  <h2>Maastricht Blox</h2>
  <div class="bar"><i></i></div>
  <div class="msg">Laying the baseplate…</div>
  <div class="tip">Fly like a map · F or double-click to walk there · controllers work too</div>
</div>
<div id="hud" class="panel">
  <h1>Maastricht Blox <button id="hudToggle" type="button" aria-expanded="true" title="Hide or show this panel (U)">hide</button></h1>
  <label>Sun <input id="time" type="range" min="5" max="23" step="0.25" value="16.5"><span id="timeLabel">16:30</span></label>
  <label><input id="tilt" type="checkbox" checked> Tilt-shift</label>
  <label><input id="ao" type="checkbox" checked> Ambient occlusion</label>
  <label><input id="anim" type="checkbox" checked> Animate (bus, boat, walkers)</label>
  <label hidden title="Merged far city, fewer far-away people, bikes and shadows. Untick to compare with the old drawing (reloads)."><input id="perf" type="checkbox" checked> Performance mode</label>
  <label>Quality <select id="quality"><option value="auto">auto</option><option value="high">high</option><option value="medium">medium</option><option value="low">low</option><option value="lite">lite</option></select><span id="tierLabel"></span></label>
  <div id="views">View: <a href="#view=hero">hero</a><a href="#view=map">map</a><a href="#view=facade">facade</a><a href="#view=river">river</a><a href="#view=gallery">pieces</a></div>
  <div id="stats">loading…</div>
</div>
<div id="info" class="panel" hidden></div>
<div id="foot" class="panel">Not affiliated with the LEGO Group.</div>
<script>if (/[?&](shot|film)=1/.test(location.search)) document.body.classList.add('shot');</script>
<script src="world.js"></script>
<script defer src="viewer.js"></script>
</body>
</html>
