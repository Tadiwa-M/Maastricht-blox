name: look-anime screenshots

on:
  push:
    branches: [look-anime]
    paths:
      - "viewer/**"
      - "pipeline/**"
      - "contract/**"
      - "scripts/shots.sh"
      - ".github/workflows/look-anime-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: look-anime

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright Chromium
        working-directory: viewer
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Generate look-test world and render Manga screenshots
        run: scripts/shots.sh hero facade gallery

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: look-anime-screenshots
          path: build/shots/*.png
          if-no-files-found: error
          retention-days: 14
