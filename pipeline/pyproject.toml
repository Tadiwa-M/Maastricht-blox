[project]
name = "blox-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pyproj>=3.6",
  "shapely>=2.0",
  "rasterio>=1.4",
  "laspy[lazrs]>=2.5",
  "osmium>=4.0",
  "requests>=2.32",
  "pillow>=10.0",
  "numba>=0.60",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
blox = "blox_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blox_pipeline"]
